name: Build Android APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ] && grep -qE '"(expo|react-native)"' package.json; then
            echo "type=rn" >> $GITHUB_OUTPUT
            echo "Detected React Native / Expo project"
          elif [ -n "$(find . -name gradlew -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "type=native" >> $GITHUB_OUTPUT
            echo "Detected Native Android (Gradle) project"
          else
            echo "type=unknown" >> $GITHUB_OUTPUT
            echo "No buildable project found"
            exit 1
          fi

      - name: Install React Native dependencies
        if: steps.detect.outputs.type == 'rn'
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install expo-image-picker expo-print expo-sharing expo-linear-gradient expo-document-picker -- --legacy-peer-deps
          npm install jszip --legacy-peer-deps --no-audit --no-fund

      - name: RN - Run expo prebuild
        if: steps.detect.outputs.type == 'rn'
        run: npx expo prebuild --platform android --no-install --clean

      - name: RN - Create debug keystore
        if: steps.detect.outputs.type == 'rn'
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: RN - Build Release APK
        if: steps.detect.outputs.type == 'rn'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Native Android - Build Debug APK
        if: steps.detect.outputs.type == 'native'
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -not -path '*/node_modules/*' | head -n 1)
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ github.run_number }}
          name: 'APK Build #${{ github.run_number }}'
          files: '**/build/outputs/apk/**/*.apk'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
